# Load balancer in front of the app replicas on one server.
# The upstream is re-resolved through docker's DNS, so `docker compose up --scale app=N`
# takes effect without restarting nginx.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    server_tokens off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream capes_app {
        zone capes_app 64k;
        # requests for the same player/cape land on the same replica, so its in-memory
        # caches stay warm and concurrent loads of the same cape get coalesced
        hash $request_uri consistent;
        # a replica that refuses a connection is skipped until the next re-resolve drops it
        server app:3026 resolve max_fails=1 fail_timeout=5s;

        keepalive 64;
        # below node's 5s keep-alive timeout, so nginx never reuses a socket node just closed
        keepalive_timeout 4s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://capes_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # replicas answer 503 while starting up; all routes are GETs, so retrying elsewhere is safe
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 15s;
            # replicas are on the same docker network, connecting only hangs if one just disappeared
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }
    }
}
